name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://orqivanta_app:orqivanta_app@localhost:5432/orqivanta
  DATABASE_ADMIN_URL: postgres://orqivanta_owner:orqivanta_owner@localhost:5432/orqivanta
  APP_URL: http://localhost:3000
  MAIL_TRANSPORT: log
  STORAGE_DIR: .storage
  DEMO_MODE: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orqivanta_owner
          POSTGRES_PASSWORD: orqivanta_owner
          POSTGRES_DB: orqivanta
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orqivanta_owner -d orqivanta"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create roles and test database
        run: psql postgres://orqivanta_owner:orqivanta_owner@localhost:5432/orqivanta -f infra/postgres/init.sql
      - run: pnpm typecheck
      - name: Core tests (permissions, tenant isolation, workflows)
        run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm demo:reset
      - run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter @orqivanta/web exec playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
