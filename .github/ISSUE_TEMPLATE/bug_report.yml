name: Bug report
description: Something doesn’t work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as priya@northwind.example
        2. Open …
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and OS
      placeholder: Chrome 130 on Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
